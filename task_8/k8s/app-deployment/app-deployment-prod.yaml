---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp-web-prod
  namespace: myapp-prod
  labels:
    app: myapp
    component: web
    environment: prod
spec:
  replicas: 3
  selector:
    matchLabels:
      app: myapp
      component: web
      environment: prod
  template:
    metadata:
      labels:
        app: myapp
        component: web
        environment: prod
    spec:
      containers:
      - name: myapp-web
        image: myapp:latest  # Replace with your actual image
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        env:
        # Database connection details
        - name: DB_HOST
          value: "myapp-db-prod.myapp-prod.svc.cluster.local"
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: myapp-db-secret
              key: database
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: myapp-db-secret
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: myapp-db-secret
              key: password
        resources:
          limits:
            memory: "1Gi"
            cpu: "1000m"
          requests:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: myapp-web-service
  namespace: myapp-prod
  labels:
    app: myapp
    component: web
    environment: prod
spec:
  type: ClusterIP
  selector:
    app: myapp
    component: web
    environment: prod
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
