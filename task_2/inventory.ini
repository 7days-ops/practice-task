[k8s_master]
master ansible_host=127.0.0.1 ansible_user=vagrant ansible_port=2222 ansible_ssh_private_key_file=../task_1/.vagrant/machines/master/vmware_fusion/private_key

[k8s_workers]
worker1 ansible_host=127.0.0.1 ansible_user=vagrant ansible_port=2200 ansible_ssh_private_key_file=../task_1/.vagrant/machines/worker1/vmware_fusion/private_key
worker2 ansible_host=127.0.0.1 ansible_user=vagrant ansible_port=2201 ansible_ssh_private_key_file=../task_1/.vagrant/machines/worker2/vmware_fusion/private_key

[all:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
