stages:
  - build
  - test
  - deploy-dev
  - deploy-test
  - deploy-staging
  - deploy-prod

variables:
  APP_NAME: "wordpress-app"
  DOCKER_REGISTRY: "registry.gitlab.com"
  DOCKER_IMAGE: "${DOCKER_REGISTRY}/${CI_PROJECT_PATH}"

# Build stage - creates Docker image
build:
  stage: build
  image: docker:24-dind
  services:
    - docker:24-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t ${DOCKER_IMAGE}:${CI_COMMIT_SHA} -t ${DOCKER_IMAGE}:latest .
    - docker push ${DOCKER_IMAGE}:${CI_COMMIT_SHA}
    - docker push ${DOCKER_IMAGE}:latest
  only:
    - branches
    - tags

# Test stage
test:unit:
  stage: test
  image: php:8.2-cli
  before_script:
    - apt-get update && apt-get install -y git unzip
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    - composer install --no-progress --no-interaction
  script:
    - vendor/bin/phpunit --configuration phpunit.xml --coverage-text
  artifacts:
    reports:
      junit: test-results.xml
  only:
    - branches
    - merge_requests

test:code-quality:
  stage: test
  image: php:8.2-cli
  before_script:
    - apt-get update && apt-get install -y git unzip
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    - composer install --no-progress --no-interaction
  script:
    - vendor/bin/phpcs --standard=PSR12 wp-content/themes/ wp-content/plugins/
    - vendor/bin/phpstan analyse wp-content/themes/ wp-content/plugins/ --level=5
  allow_failure: true
  only:
    - branches
    - merge_requests

test:security:
  stage: test
  image: php:8.2-cli
  before_script:
    - apt-get update && apt-get install -y git unzip
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
  script:
    - composer audit
  allow_failure: true
  only:
    - branches
    - merge_requests

# Deploy to Development
deploy:dev:
  stage: deploy-dev
  image: bitnami/kubectl:latest
  variables:
    NAMESPACE: "${APP_NAME}-dev"
    ENVIRONMENT: "dev"
  before_script:
    - kubectl config use-context ${K8S_CONTEXT_DEV}
  script:
    - kubectl create namespace ${NAMESPACE} --dry-run=client -o yaml | kubectl apply -f -
    - |
      cat <<EOF | kubectl apply -f -
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ${APP_NAME}
        namespace: ${NAMESPACE}
        labels:
          app: ${APP_NAME}
          environment: ${ENVIRONMENT}
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: ${APP_NAME}
        template:
          metadata:
            labels:
              app: ${APP_NAME}
              environment: ${ENVIRONMENT}
          spec:
            containers:
            - name: wordpress
              image: ${DOCKER_IMAGE}:${CI_COMMIT_SHA}
              ports:
              - containerPort: 80
              env:
              - name: WORDPRESS_DB_HOST
                value: "${DB_HOST_DEV}"
              - name: WORDPRESS_DB_USER
                valueFrom:
                  secretKeyRef:
                    name: ${APP_NAME}-db-secret
                    key: username
              - name: WORDPRESS_DB_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: ${APP_NAME}-db-secret
                    key: password
              - name: WORDPRESS_DB_NAME
                value: "${APP_NAME}_dev"
      ---
      apiVersion: v1
      kind: Service
      metadata:
        name: ${APP_NAME}-service
        namespace: ${NAMESPACE}
      spec:
        selector:
          app: ${APP_NAME}
        ports:
        - protocol: TCP
          port: 80
          targetPort: 80
        type: LoadBalancer
      EOF
    - kubectl rollout status deployment/${APP_NAME} -n ${NAMESPACE} --timeout=5m
  environment:
    name: development
    url: https://dev.${APP_NAME}.example.com
    on_stop: stop:dev
  only:
    - develop

stop:dev:
  stage: deploy-dev
  image: bitnami/kubectl:latest
  variables:
    NAMESPACE: "${APP_NAME}-dev"
  script:
    - kubectl config use-context ${K8S_CONTEXT_DEV}
    - kubectl delete namespace ${NAMESPACE} --ignore-not-found=true
  environment:
    name: development
    action: stop
  when: manual
  only:
    - develop

# Deploy to Test
deploy:test:
  stage: deploy-test
  image: bitnami/kubectl:latest
  variables:
    NAMESPACE: "${APP_NAME}-test"
    ENVIRONMENT: "test"
  before_script:
    - kubectl config use-context ${K8S_CONTEXT_TEST}
  script:
    - kubectl create namespace ${NAMESPACE} --dry-run=client -o yaml | kubectl apply -f -
    - |
      cat <<EOF | kubectl apply -f -
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ${APP_NAME}
        namespace: ${NAMESPACE}
        labels:
          app: ${APP_NAME}
          environment: ${ENVIRONMENT}
      spec:
        replicas: 2
        selector:
          matchLabels:
            app: ${APP_NAME}
        template:
          metadata:
            labels:
              app: ${APP_NAME}
              environment: ${ENVIRONMENT}
          spec:
            containers:
            - name: wordpress
              image: ${DOCKER_IMAGE}:${CI_COMMIT_SHA}
              ports:
              - containerPort: 80
              env:
              - name: WORDPRESS_DB_HOST
                value: "${DB_HOST_TEST}"
              - name: WORDPRESS_DB_USER
                valueFrom:
                  secretKeyRef:
                    name: ${APP_NAME}-db-secret
                    key: username
              - name: WORDPRESS_DB_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: ${APP_NAME}-db-secret
                    key: password
              - name: WORDPRESS_DB_NAME
                value: "${APP_NAME}_test"
              resources:
                requests:
                  memory: "256Mi"
                  cpu: "250m"
                limits:
                  memory: "512Mi"
                  cpu: "500m"
      ---
      apiVersion: v1
      kind: Service
      metadata:
        name: ${APP_NAME}-service
        namespace: ${NAMESPACE}
      spec:
        selector:
          app: ${APP_NAME}
        ports:
        - protocol: TCP
          port: 80
          targetPort: 80
        type: LoadBalancer
      EOF
    - kubectl rollout status deployment/${APP_NAME} -n ${NAMESPACE} --timeout=5m
  environment:
    name: test
    url: https://test.${APP_NAME}.example.com
    on_stop: stop:test
  only:
    - develop
    - merge_requests

stop:test:
  stage: deploy-test
  image: bitnami/kubectl:latest
  variables:
    NAMESPACE: "${APP_NAME}-test"
  script:
    - kubectl config use-context ${K8S_CONTEXT_TEST}
    - kubectl delete namespace ${NAMESPACE} --ignore-not-found=true
  environment:
    name: test
    action: stop
  when: manual
  only:
    - develop
    - merge_requests

# Deploy to Staging
deploy:staging:
  stage: deploy-staging
  image: bitnami/kubectl:latest
  variables:
    NAMESPACE: "${APP_NAME}-staging"
    ENVIRONMENT: "staging"
  before_script:
    - kubectl config use-context ${K8S_CONTEXT_STAGING}
  script:
    - kubectl create namespace ${NAMESPACE} --dry-run=client -o yaml | kubectl apply -f -
    - |
      cat <<EOF | kubectl apply -f -
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ${APP_NAME}
        namespace: ${NAMESPACE}
        labels:
          app: ${APP_NAME}
          environment: ${ENVIRONMENT}
      spec:
        replicas: 3
        selector:
          matchLabels:
            app: ${APP_NAME}
        template:
          metadata:
            labels:
              app: ${APP_NAME}
              environment: ${ENVIRONMENT}
          spec:
            containers:
            - name: wordpress
              image: ${DOCKER_IMAGE}:${CI_COMMIT_SHA}
              ports:
              - containerPort: 80
              env:
              - name: WORDPRESS_DB_HOST
                value: "${DB_HOST_STAGING}"
              - name: WORDPRESS_DB_USER
                valueFrom:
                  secretKeyRef:
                    name: ${APP_NAME}-db-secret
                    key: username
              - name: WORDPRESS_DB_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: ${APP_NAME}-db-secret
                    key: password
              - name: WORDPRESS_DB_NAME
                value: "${APP_NAME}_staging"
              resources:
                requests:
                  memory: "512Mi"
                  cpu: "500m"
                limits:
                  memory: "1Gi"
                  cpu: "1000m"
              livenessProbe:
                httpGet:
                  path: /wp-admin/install.php
                  port: 80
                initialDelaySeconds: 30
                periodSeconds: 10
              readinessProbe:
                httpGet:
                  path: /wp-admin/install.php
                  port: 80
                initialDelaySeconds: 10
                periodSeconds: 5
      ---
      apiVersion: v1
      kind: Service
      metadata:
        name: ${APP_NAME}-service
        namespace: ${NAMESPACE}
      spec:
        selector:
          app: ${APP_NAME}
        ports:
        - protocol: TCP
          port: 80
          targetPort: 80
        type: LoadBalancer
      EOF
    - kubectl rollout status deployment/${APP_NAME} -n ${NAMESPACE} --timeout=5m
  environment:
    name: staging
    url: https://staging.${APP_NAME}.example.com
  only:
    - main
    - master
  when: manual

# Deploy to Production
deploy:prod:
  stage: deploy-prod
  image: bitnami/kubectl:latest
  variables:
    NAMESPACE: "${APP_NAME}-prod"
    ENVIRONMENT: "prod"
  before_script:
    - kubectl config use-context ${K8S_CONTEXT_PROD}
  script:
    - kubectl create namespace ${NAMESPACE} --dry-run=client -o yaml | kubectl apply -f -
    - |
      cat <<EOF | kubectl apply -f -
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ${APP_NAME}
        namespace: ${NAMESPACE}
        labels:
          app: ${APP_NAME}
          environment: ${ENVIRONMENT}
      spec:
        replicas: 5
        strategy:
          type: RollingUpdate
          rollingUpdate:
            maxSurge: 1
            maxUnavailable: 0
        selector:
          matchLabels:
            app: ${APP_NAME}
        template:
          metadata:
            labels:
              app: ${APP_NAME}
              environment: ${ENVIRONMENT}
          spec:
            containers:
            - name: wordpress
              image: ${DOCKER_IMAGE}:${CI_COMMIT_SHA}
              ports:
              - containerPort: 80
              env:
              - name: WORDPRESS_DB_HOST
                value: "${DB_HOST_PROD}"
              - name: WORDPRESS_DB_USER
                valueFrom:
                  secretKeyRef:
                    name: ${APP_NAME}-db-secret
                    key: username
              - name: WORDPRESS_DB_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: ${APP_NAME}-db-secret
                    key: password
              - name: WORDPRESS_DB_NAME
                value: "${APP_NAME}_prod"
              resources:
                requests:
                  memory: "1Gi"
                  cpu: "1000m"
                limits:
                  memory: "2Gi"
                  cpu: "2000m"
              livenessProbe:
                httpGet:
                  path: /wp-admin/install.php
                  port: 80
                initialDelaySeconds: 30
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 3
              readinessProbe:
                httpGet:
                  path: /wp-admin/install.php
                  port: 80
                initialDelaySeconds: 10
                periodSeconds: 5
                timeoutSeconds: 3
                failureThreshold: 3
      ---
      apiVersion: v1
      kind: Service
      metadata:
        name: ${APP_NAME}-service
        namespace: ${NAMESPACE}
      spec:
        selector:
          app: ${APP_NAME}
        ports:
        - protocol: TCP
          port: 80
          targetPort: 80
        type: LoadBalancer
      ---
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: ${APP_NAME}-hpa
        namespace: ${NAMESPACE}
      spec:
        scaleTargetRef:
          apiVersion: apps/v1
          kind: Deployment
          name: ${APP_NAME}
        minReplicas: 5
        maxReplicas: 10
        metrics:
        - type: Resource
          resource:
            name: cpu
            target:
              type: Utilization
              averageUtilization: 70
        - type: Resource
          resource:
            name: memory
            target:
              type: Utilization
              averageUtilization: 80
      EOF
    - kubectl rollout status deployment/${APP_NAME} -n ${NAMESPACE} --timeout=10m
  environment:
    name: production
    url: https://www.${APP_NAME}.example.com
  only:
    - main
    - master
    - tags
  when: manual
